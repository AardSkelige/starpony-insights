# Линтер бэкенда: только ошибки логики, не стиль.
#
# Заведён 29.08 после того, как обзор кода нашёл в разборе строки задвоенный
# ключ словаря — `"quantity"` дважды подряд со сбитым отступом, остаток
# неудачной правки. Синтаксически это валидно, поэтому ни `pytest`, ни `tsc`
# такое не ловят: второй ключ молча затирает первый.
#
# `F` (Pyflakes) ловит ровно этот класс — то, что исполняется и делает
# не то, что написано: задвоенные ключи (F601), неиспользованные импорты
# (F401), необъявленные имена (F821), переопределения (F811).
# `E9` — синтаксические ошибки, которые до `pytest` вообще не доходят.
#
# **Стиля здесь нет намеренно.** Расширенный набор Ruff засыпает существующий
# код замечаниями по длине строк, докстрингам, аннотациям и другим соглашениям,
# которые не связаны с тихими ошибками исполнения. Проект пишет развёрнутые
# комментарии по-русски, и подгонять их под чужой порог значит либо резать
# объяснения, либо получить хук, который ругается всегда и потому не читается.
# `I` (порядок импортов) тоже не включён: импорты местами сгруппированы
# вручную и с комментариями.
#
# Правило то же, что у `max-lines` во фронтенде: **потолок держится решением,
# а не линтером.** Линтер стережёт только то, что человек не увидит глазами.
target-version = "py312"

[lint]
select = ["F", "E9"]
