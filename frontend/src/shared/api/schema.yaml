          type: string
      required:
      - duration_seconds
      - error
      - finished_at
      - request_count
      - started_at
      - status
      - status_label
    SyncStatus:
      type: object
      properties:
        running:
          type: boolean
        started_at:
          type: string
          format: date-time
          nullable: true
      required:
      - running
      - started_at
    Timeline:
      type: object
      description: |-
        Продажи во времени. Заменило журнал последних отгрузок.

        Шаг подбирается под период на сервере и приходит подписью: два места,
        решающие это по-своему, разъедутся, а человек обязан видеть, в чём мерят,
        иначе смена шага читается как смена данных.
      properties:
        step:
          type: string
        step_label:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/TimelinePoint'
      required:
      - points
      - step
      - step_label
    TimelinePoint:
      type: object
      description: 'Один столбик: начало промежутка и что в него попало.'
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        revenue_kopecks:
          type: integer
      required:
      - end
      - quantity
      - revenue_kopecks
      - start
    WithoutPlanRow:
      type: object
      description: |-
        Проданное, чего техкарта не описывает: услуги и покупные товары.

        Отдельным списком, а не строкой в таблице: доставка не сырьё, и в сумму
        материалов она не входит. Спрятать её тоже нельзя — тогда «сырья на
        399 686 ₽» читалось бы как расход по всей выручке.
      properties:
        product_id:
          type: integer
        name:
          type: string
        article:
          type: string
        code:
          type: string
        uom:
          type: string
        is_service:
          type: boolean
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        revenue_kopecks:
          type: integer
      required:
      - article
      - code
      - is_service
      - name
      - product_id
      - quantity
      - revenue_kopecks
      - uom
