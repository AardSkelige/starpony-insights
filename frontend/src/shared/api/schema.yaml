    ShipmentMaterialsCoverage:
      type: object
      description: |-
        Насколько полное число видит человек — про выборку отгрузок целиком.

        Поиск сюда не входит намеренно: он сужает список материалов, а не то,
        что отгрузили. Возьми стоимость с учётом поиска, а выручку без —
        получится дробь, которая выглядит обычным процентом и врёт молча.
      properties:
        materials_count:
          type: integer
        cost_kopecks:
          type: integer
        priced_count:
          type: integer
        unpriced_count:
          type: integer
        sold_products_count:
          type: integer
        exploded_products_count:
          type: integer
        without_plan_count:
          type: integer
        revenue_kopecks:
          type: integer
        documents_count:
          type: integer
        cost_share_of_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,8})?$
          nullable: true
      required:
      - cost_kopecks
      - cost_share_of_revenue
      - documents_count
      - exploded_products_count
      - materials_count
      - priced_count
      - revenue_kopecks
      - sold_products_count
      - unpriced_count
      - without_plan_count
    ShipmentMaterialsTotals:
      type: object
      description: |-
        Итог под таблицей — про то, что в ней видно, с учётом поиска.

        Обязан сходиться со сложением колонки: файл и экран открывают затем,
        чтобы складывать, и расхождение заметят раньше нас.
      properties:
        materials_count:
          type: integer
        cost_kopecks:
          type: integer
        cost_share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
        priced_count:
          type: integer
        unpriced_count:
          type: integer
      required:
      - cost_kopecks
      - cost_share
      - materials_count
      - priced_count
      - unpriced_count
