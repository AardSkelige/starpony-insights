          nullable: true
        above_best:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,8})?$
          nullable: true
      required:
      - above_best
      - amount_kopecks
      - avg_price_kopecks
      - last_moment
      - last_price_kopecks
      - name
      - quantity
      - supplier_id
      - supplies_count
