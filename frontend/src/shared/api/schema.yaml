openapi: 3.0.3
info:
  title: StarPony Insights API
  version: 1.0.0
paths:
  /api/auth/csrf/:
    get:
      operationId: api_auth_csrf_retrieve
      description: |-
        Выдать CSRF-куку перед формой входа.

        Фронтенд — статика, отданная прокси, шаблонов Django он не рендерит,
        поэтому получить токен из скрытого поля формы неоткуда.
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/shipments/materials/:
    get:
      operationId: shipment_materials_list
      description: Сколько сырья ушло вместе с проданной продукцией. Проданное разворачивается
        по техкартам до того, что закупают.
      summary: Материалы в отгрузках
      parameters:
      - in: query
        name: channel_id
        schema:
          type: integer
          nullable: true
      - in: query
        name: date_from
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: date_to
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: ordering
        schema:
          enum:
          - -cost
          - -name
          - -products
          - -quantity
          - -share
          - cost
          - name
          - products
          - quantity
          - share
          type: string
          default: -cost
          minLength: 1
        description: |-
          * `-cost` - -cost
          * `-name` - -name
          * `-products` - -products
          * `-quantity` - -quantity
          * `-share` - -share
          * `cost` - cost
          * `name` - name
          * `products` - products
          * `quantity` - quantity
          * `share` - share
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
      - in: query
        name: search
        schema:
          type: string
          default: ''
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentMaterials'
          description: ''
  /api/shipments/materials/{material_id}/:
    get:
      operationId: shipment_material_detail
      description: 'Из каких изделий материал пришёл и какими путями по техкартам.
        Фильтры те же, что у таблицы: слагаемые обязаны сходиться с числом своей строки.'
      summary: Материал в отгрузках — откуда взялось число
      parameters:
      - in: query
        name: channel_id
        schema:
          type: integer
          nullable: true
      - in: query
        name: date_from
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: date_to
        schema:
          type: string
          format: date
          nullable: true
      - in: path
        name: material_id
        schema:
          type: integer
        required: true
      - in: query
        name: ordering
        schema:
          enum:
          - -cost
          - -name
          - -products
          - -quantity
          - -share
          - cost
          - name
          - products
          - quantity
          - share
          type: string
          default: -cost
          minLength: 1
        description: |-
          * `-cost` - -cost
          * `-name` - -name
          * `-products` - -products
          * `-quantity` - -quantity
          * `-share` - -share
          * `cost` - cost
          * `name` - name
          * `products` - products
          * `quantity` - quantity
          * `share` - share
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
      - in: query
        name: search
        schema:
          type: string
          default: ''
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentMaterialDetail'
          description: ''
        '404':
          description: No response body
  /api/shipments/materials/xlsx/:
    get:
      operationId: shipment_materials_xlsx
      description: 'Та же выборка, что на экране, целиком. Вторым листом — проданное
        без техкарты: в сумму сырья оно не входит.'
      summary: Материалы в отгрузках — выгрузка в Excel
      parameters:
      - in: query
        name: channel_id
        schema:
          type: integer
          nullable: true
      - in: query
        name: date_from
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: date_to
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: ordering
        schema:
          enum:
          - -cost
          - -name
          - -products
          - -quantity
          - -share
          - cost
          - name
          - products
          - quantity
          - share
          type: string
          default: -cost
          minLength: 1
        description: |-
          * `-cost` - -cost
          * `-name` - -name
          * `-products` - -products
          * `-quantity` - -quantity
          * `-share` - -share
          * `cost` - cost
          * `name` - name
          * `products` - products
          * `quantity` - quantity
          * `share` - share
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
      - in: query
        name: search
        schema:
          type: string
          default: ''
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          description: ''
  /api/shipments/products/:
    get:
      operationId: shipment_products_list
      description: Что и сколько продано за период, свёрнутое по товару.
      summary: Товары в отгрузках
      parameters:
      - in: query
        name: channel_id
        schema:
          type: integer
          nullable: true
      - in: query
        name: date_from
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: date_to
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: ordering
        schema:
          enum:
          - -avg_price
          - -free
          - -name
          - -quantity
          - -revenue
          - -share
          - avg_price
          - free
          - name
          - quantity
          - revenue
          - share
          type: string
          default: -revenue
          minLength: 1
        description: |-
          * `-avg_price` - -avg_price
          * `-free` - -free
          * `-name` - -name
          * `-quantity` - -quantity
          * `-revenue` - -revenue
          * `-share` - -share
          * `avg_price` - avg_price
          * `free` - free
          * `name` - name
          * `quantity` - quantity
          * `revenue` - revenue
          * `share` - share
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
      - in: query
        name: search
        schema:
          type: string
          default: ''
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentProducts'
          description: ''
  /api/shipments/products/{product_id}/:
    get:
      operationId: shipment_product_detail
      description: 'Разбивка по каналам, последние отгрузки и остаток. Фильтры те
        же, что у таблицы: детали обязаны сходиться с числами своей строки.'
      summary: Товар в отгрузках — детали строки
      parameters:
      - in: query
        name: channel_id
        schema:
          type: integer
          nullable: true
      - in: query
        name: date_from
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: date_to
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: ordering
        schema:
          enum:
          - -avg_price
          - -free
          - -name
          - -quantity
          - -revenue
          - -share
          - avg_price
          - free
          - name
          - quantity
          - revenue
          - share
          type: string
          default: -revenue
          minLength: 1
        description: |-
          * `-avg_price` - -avg_price
          * `-free` - -free
          * `-name` - -name
          * `-quantity` - -quantity
          * `-revenue` - -revenue
          * `-share` - -share
          * `avg_price` - avg_price
          * `free` - free
          * `name` - name
          * `quantity` - quantity
          * `revenue` - revenue
          * `share` - share
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      - in: query
        name: search
        schema:
          type: string
          default: ''
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentProductDetail'
          description: ''
        '404':
          description: No response body
  /api/shipments/products/xlsx/:
    get:
      operationId: shipment_products_xlsx
      description: 'Та же выборка, что на экране, но целиком: все страницы, а не видимая.'
      summary: Товары в отгрузках — выгрузка в Excel
      parameters:
      - in: query
        name: channel_id
        schema:
          type: integer
          nullable: true
      - in: query
        name: date_from
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: date_to
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: ordering
        schema:
          enum:
          - -avg_price
          - -free
          - -name
          - -quantity
          - -revenue
          - -share
          - avg_price
          - free
          - name
          - quantity
          - revenue
          - share
          type: string
          default: -revenue
          minLength: 1
        description: |-
          * `-avg_price` - -avg_price
          * `-free` - -free
          * `-name` - -name
          * `-quantity` - -quantity
          * `-revenue` - -revenue
          * `-share` - -share
          * `avg_price` - avg_price
          * `free` - free
          * `name` - name
          * `quantity` - quantity
          * `revenue` - revenue
          * `share` - share
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
      - in: query
        name: search
        schema:
          type: string
          default: ''
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          description: ''
  /api/sync/refresh/:
    post:
      operationId: sync_refresh
      description: 'Единственное место, где запрос человека доходит до МойСклада.
        Ограничено паузой между запусками и блокировкой: корзина лимита общая с ботом,
        который проверяет учёт круглосуточно.'
      summary: Обновить данные из МойСклада
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRun'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refused'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refused'
          description: ''
  /api/sync/status/:
    get:
      operationId: sync_status
      description: 'Состояние живёт на сервере, а не в памяти вкладки: иначе перезагрузка
        стирает его у запустившего, а остальные не видят вовсе.'
      summary: Идёт ли синхронизация
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
          description: ''
  /healthz:
    get:
      operationId: healthz_retrieve
      tags:
      - healthz
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
components:
  schemas:
    ChannelShare:
      type: object
      description: Доля канала в продажах товара. Основа полос в раскрытии строки.
      properties:
        id:
          type: integer
          nullable: true
        name:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        revenue_kopecks:
          type: integer
      required:
      - id
      - name
      - quantity
      - revenue_kopecks
    Csrf:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - password
      - username
    MaterialHead:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        article:
          type: string
        code:
          type: string
        uom:
          type: string
      required:
      - article
      - code
      - id
      - name
      - uom
    MaterialPath:
      type: object
      description: |-
        Один путь по техкартам и то, сколько материала пришло именно им.

        Количество обязательно: без него путь говорит «через замес и через
        розлив», но не отвечает, чего сколько, — а объяснение, которое не
        складывается обратно в объясняемое число, объяснением не является.
      properties:
        chain:
          type: array
          items:
            type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
      required:
      - chain
      - quantity
    MaterialPrice:
      type: object
      description: |-
        Откуда взялась цена: документ, дата, поставщик.

        Число, посчитанное по цене, обязано назвать её источник. Иначе колонка
        «Стоимость» остаётся суммой, за которую никто не отвечает.
      properties:
        price_kopecks:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        moment:
          type: string
          format: date-time
        document_number:
          type: string
        supplier:
          type: string
      required:
      - document_number
      - moment
      - price_kopecks
      - supplier
    MaterialRest:
      type: object
      description: |-
        Свёрнутый хвост списка источников.

        Без него показанные слагаемые не складывались бы в число, которое панель
        объясняет: у воды пятьдесят девять изделий-источников, а видно двадцать.
      properties:
        products_count:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
      required:
      - products_count
      - quantity
    MaterialSource:
      type: object
      description: Изделие, из-за продажи которого материал израсходован.
      properties:
        product_id:
          type: integer
        name:
          type: string
        sold_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        sold_uom:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        paths:
          type: array
          items:
            $ref: '#/components/schemas/MaterialPath'
      required:
      - name
      - paths
      - product_id
      - quantity
      - sold_quantity
      - sold_uom
    MaterialStock:
      type: object
      properties:
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        reserved:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        available:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        stock_days:
          type: integer
          nullable: true
      required:
      - available
      - quantity
      - reserved
      - stock_days
    Page:
      type: object
      description: Страница в меню. Префиксы API наружу не отдаются — это деталь защиты.
      properties:
        key:
          type: string
        label:
          type: string
        group:
          type: string
        route:
          type: string
      required:
      - group
      - key
      - label
      - route
    ProductDocument:
      type: object
      properties:
        number:
          type: string
        moment:
          type: string
          format: date-time
        agent:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        total_kopecks:
          type: integer
      required:
      - agent
      - moment
      - number
      - quantity
      - total_kopecks
    ProductStock:
      type: object
      properties:
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        reserved:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        available:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        stock_days:
          type: integer
          nullable: true
      required:
      - available
      - quantity
      - reserved
      - stock_days
    Profile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        full_name:
          type: string
        is_superuser:
          type: boolean
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Page'
      required:
      - full_name
      - id
      - is_superuser
      - pages
      - username
    Refused:
      type: object
      properties:
        detail:
          type: string
        retry_after_seconds:
          type: integer
      required:
      - detail
      - retry_after_seconds
    SalesChannel:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    ShipmentMaterialDetail:
      type: object
      properties:
        material:
          $ref: '#/components/schemas/MaterialHead'
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        cost_kopecks:
          type: integer
          nullable: true
        price:
          allOf:
          - $ref: '#/components/schemas/MaterialPrice'
          nullable: true
        stock:
          allOf:
          - $ref: '#/components/schemas/MaterialStock'
          nullable: true
        sources_count:
          type: integer
        sources:
          type: array
          items:
            $ref: '#/components/schemas/MaterialSource'
        rest:
          allOf:
          - $ref: '#/components/schemas/MaterialRest'
          nullable: true
      required:
      - cost_kopecks
      - material
      - price
      - quantity
      - rest
      - sources
      - sources_count
      - stock
    ShipmentMaterialRow:
      type: object
      properties:
        material_id:
          type: integer
        name:
          type: string
        article:
          type: string
        code:
          type: string
        uom:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        products_count:
          type: integer
        price_kopecks:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
          nullable: true
        price_moment:
          type: string
          format: date-time
          nullable: true
        cost_kopecks:
          type: integer
          nullable: true
        cost_share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
      required:
      - article
      - code
      - cost_kopecks
      - cost_share
      - material_id
      - name
      - price_kopecks
      - price_moment
      - products_count
      - quantity
      - uom
    ShipmentMaterials:
      type: object
      properties:
        synced_at:
          type: string
          format: date-time
          nullable: true
        count:
          type: integer
        totals:
          $ref: '#/components/schemas/ShipmentMaterialsTotals'
        coverage:
          $ref: '#/components/schemas/ShipmentMaterialsCoverage'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentMaterialRow'
        without_plan:
          type: array
          items:
            $ref: '#/components/schemas/WithoutPlanRow'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/SalesChannel'
      required:
      - channels
      - count
      - coverage
      - results
      - synced_at
      - totals
      - without_plan
    ShipmentMaterialsCoverage:
      type: object
      description: |-
        Насколько полное число видит человек — про выборку отгрузок целиком.

        Поиск сюда не входит намеренно: он сужает список материалов, а не то,
        что отгрузили. Возьми стоимость с учётом поиска, а выручку без —
        получится дробь, которая выглядит обычным процентом и врёт молча.
      properties:
        materials_count:
          type: integer
        cost_kopecks:
          type: integer
        priced_count:
          type: integer
        unpriced_count:
          type: integer
        sold_products_count:
          type: integer
        exploded_products_count:
          type: integer
        without_plan_count:
          type: integer
        revenue_kopecks:
          type: integer
        documents_count:
          type: integer
        cost_share_of_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,8})?$
          nullable: true
      required:
      - cost_kopecks
      - cost_share_of_revenue
      - documents_count
      - exploded_products_count
      - materials_count
      - priced_count
      - revenue_kopecks
      - sold_products_count
      - unpriced_count
      - without_plan_count
    ShipmentMaterialsTotals:
      type: object
      description: |-
        Итог под таблицей — про то, что в ней видно, с учётом поиска.

        Обязан сходиться со сложением колонки: файл и экран открывают затем,
        чтобы складывать, и расхождение заметят раньше нас.
      properties:
        materials_count:
          type: integer
        cost_kopecks:
          type: integer
        cost_share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
        priced_count:
          type: integer
        unpriced_count:
          type: integer
      required:
      - cost_kopecks
      - cost_share
      - materials_count
      - priced_count
      - unpriced_count
    ShipmentProductDetail:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelShare'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ProductDocument'
        stock:
          allOf:
          - $ref: '#/components/schemas/ProductStock'
          nullable: true
      required:
      - channels
      - documents
      - stock
    ShipmentProductRow:
      type: object
      properties:
        product_id:
          type: integer
        name:
          type: string
        article:
          type: string
        code:
          type: string
        uom:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        free_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        revenue_kopecks:
          type: integer
        documents_count:
          type: integer
        avg_price_kopecks:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
          nullable: true
        avg_price_paid_kopecks:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
          nullable: true
        revenue_share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
      required:
      - article
      - avg_price_kopecks
      - avg_price_paid_kopecks
      - code
      - documents_count
      - free_quantity
      - name
      - product_id
      - quantity
      - revenue_kopecks
      - revenue_share
      - uom
    ShipmentProducts:
      type: object
      properties:
        synced_at:
          type: string
          format: date-time
          nullable: true
        count:
          type: integer
        totals:
          $ref: '#/components/schemas/ShipmentProductsTotals'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentProductRow'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/SalesChannel'
      required:
      - channels
      - count
      - results
      - synced_at
      - totals
    ShipmentProductsTotals:
      type: object
      properties:
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        free_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        revenue_kopecks:
          type: integer
        documents_count:
          type: integer
        products_count:
          type: integer
      required:
      - documents_count
      - free_quantity
      - products_count
      - quantity
      - revenue_kopecks
    SyncRun:
      type: object
      properties:
        status:
          type: string
        status_label:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: number
          format: double
          nullable: true
        request_count:
          type: integer
        error:
          type: string
      required:
      - duration_seconds
      - error
      - finished_at
      - request_count
      - started_at
      - status
      - status_label
    SyncStatus:
      type: object
      properties:
        running:
          type: boolean
        started_at:
          type: string
          format: date-time
          nullable: true
      required:
      - running
      - started_at
    WithoutPlanRow:
      type: object
      description: |-
        Проданное, чего техкарта не описывает: услуги и покупные товары.

        Отдельным списком, а не строкой в таблице: доставка не сырьё, и в сумму
        материалов она не входит. Спрятать её тоже нельзя — тогда «сырья на
        399 686 ₽» читалось бы как расход по всей выручке.
      properties:
        product_id:
          type: integer
        name:
          type: string
        article:
          type: string
        code:
          type: string
        uom:
          type: string
        is_service:
          type: boolean
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        revenue_kopecks:
          type: integer
      required:
      - article
      - code
      - is_service
      - name
      - product_id
      - quantity
      - revenue_kopecks
      - uom
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
