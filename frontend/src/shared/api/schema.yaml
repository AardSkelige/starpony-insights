openapi: 3.0.3
info:
  title: StarPony Insights API
  version: 1.0.0
paths:
  /api/auth/csrf/:
    get:
      operationId: api_auth_csrf_retrieve
      description: |-
        Выдать CSRF-куку перед формой входа.

        Фронтенд — статика, отданная прокси, шаблонов Django он не рендерит,
        поэтому получить токен из скрытого поля формы неоткуда.
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/shipments/products/:
    get:
      operationId: shipment_products_list
      description: Что и сколько продано за период, свёрнутое по товару.
      summary: Товары в отгрузках
      parameters:
      - in: query
        name: channel_id
        schema:
          type: integer
          nullable: true
      - in: query
        name: date_from
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: date_to
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: ordering
        schema:
          enum:
          - -avg_price
          - -free
          - -name
          - -quantity
          - -revenue
          - -share
          - avg_price
          - free
          - name
          - quantity
          - revenue
          - share
          type: string
          default: -revenue
          minLength: 1
        description: |-
          * `-avg_price` - -avg_price
          * `-free` - -free
          * `-name` - -name
          * `-quantity` - -quantity
          * `-revenue` - -revenue
          * `-share` - -share
          * `avg_price` - avg_price
          * `free` - free
          * `name` - name
          * `quantity` - quantity
          * `revenue` - revenue
          * `share` - share
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
      - in: query
        name: search
        schema:
          type: string
          default: ''
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentProducts'
          description: ''
  /api/shipments/products/{product_id}/:
    get:
      operationId: shipment_product_detail
      description: 'Разбивка по каналам, последние отгрузки и остаток. Фильтры те
        же, что у таблицы: детали обязаны сходиться с числами своей строки.'
      summary: Товар в отгрузках — детали строки
      parameters:
      - in: query
        name: channel_id
        schema:
          type: integer
          nullable: true
      - in: query
        name: date_from
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: date_to
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: ordering
        schema:
          enum:
          - -avg_price
          - -free
          - -name
          - -quantity
          - -revenue
          - -share
          - avg_price
          - free
          - name
          - quantity
          - revenue
          - share
          type: string
          default: -revenue
          minLength: 1
        description: |-
          * `-avg_price` - -avg_price
          * `-free` - -free
          * `-name` - -name
          * `-quantity` - -quantity
          * `-revenue` - -revenue
          * `-share` - -share
          * `avg_price` - avg_price
          * `free` - free
          * `name` - name
          * `quantity` - quantity
          * `revenue` - revenue
          * `share` - share
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      - in: query
        name: search
        schema:
          type: string
          default: ''
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentProductDetail'
          description: ''
        '404':
          description: No response body
  /api/shipments/products/xlsx/:
    get:
      operationId: shipment_products_xlsx
      description: 'Та же выборка, что на экране, но целиком: все страницы, а не видимая.'
      summary: Товары в отгрузках — выгрузка в Excel
      parameters:
      - in: query
        name: channel_id
        schema:
          type: integer
          nullable: true
      - in: query
        name: date_from
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: date_to
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: ordering
        schema:
          enum:
          - -avg_price
          - -free
          - -name
          - -quantity
          - -revenue
          - -share
          - avg_price
          - free
          - name
          - quantity
          - revenue
          - share
          type: string
          default: -revenue
          minLength: 1
        description: |-
          * `-avg_price` - -avg_price
          * `-free` - -free
          * `-name` - -name
          * `-quantity` - -quantity
          * `-revenue` - -revenue
          * `-share` - -share
          * `avg_price` - avg_price
          * `free` - free
          * `name` - name
          * `quantity` - quantity
          * `revenue` - revenue
          * `share` - share
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
      - in: query
        name: search
        schema:
          type: string
          default: ''
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          description: ''
  /api/sync/refresh/:
    post:
      operationId: sync_refresh
      description: 'Единственное место, где запрос человека доходит до МойСклада.
        Ограничено паузой между запусками и блокировкой: корзина лимита общая с ботом,
        который проверяет учёт круглосуточно.'
      summary: Обновить данные из МойСклада
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRun'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refused'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refused'
          description: ''
  /api/sync/status/:
    get:
      operationId: sync_status
      description: 'Состояние живёт на сервере, а не в памяти вкладки: иначе перезагрузка
        стирает его у запустившего, а остальные не видят вовсе.'
      summary: Идёт ли синхронизация
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
          description: ''
  /healthz:
    get:
      operationId: healthz_retrieve
      tags:
      - healthz
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
components:
  schemas:
    ChannelShare:
      type: object
      description: Доля канала в продажах товара. Основа полос в раскрытии строки.
      properties:
        id:
          type: integer
          nullable: true
        name:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        revenue_kopecks:
          type: integer
      required:
      - id
      - name
      - quantity
      - revenue_kopecks
    Csrf:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - password
      - username
    Page:
      type: object
      description: Страница в меню. Префиксы API наружу не отдаются — это деталь защиты.
      properties:
        key:
          type: string
        label:
          type: string
        group:
          type: string
        route:
          type: string
      required:
      - group
      - key
      - label
      - route
    ProductDocument:
      type: object
      properties:
        number:
          type: string
        moment:
          type: string
          format: date-time
        agent:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        total_kopecks:
          type: integer
      required:
      - agent
      - moment
      - number
      - quantity
      - total_kopecks
    ProductStock:
      type: object
      properties:
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        reserved:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        available:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        stock_days:
          type: integer
          nullable: true
      required:
      - available
      - quantity
      - reserved
      - stock_days
    Profile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        full_name:
          type: string
        is_superuser:
          type: boolean
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Page'
      required:
      - full_name
      - id
      - is_superuser
      - pages
      - username
    Refused:
      type: object
      properties:
        detail:
          type: string
        retry_after_seconds:
          type: integer
      required:
      - detail
      - retry_after_seconds
    SalesChannel:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    ShipmentProductDetail:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelShare'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ProductDocument'
        stock:
          allOf:
          - $ref: '#/components/schemas/ProductStock'
          nullable: true
      required:
      - channels
      - documents
      - stock
    ShipmentProductRow:
      type: object
      properties:
        product_id:
          type: integer
        name:
          type: string
        article:
          type: string
        code:
          type: string
        uom:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        free_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        revenue_kopecks:
          type: integer
        documents_count:
          type: integer
        avg_price_kopecks:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
          nullable: true
        avg_price_paid_kopecks:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
          nullable: true
        revenue_share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
      required:
      - article
      - avg_price_kopecks
      - avg_price_paid_kopecks
      - code
      - documents_count
      - free_quantity
      - name
      - product_id
      - quantity
      - revenue_kopecks
      - revenue_share
      - uom
    ShipmentProducts:
      type: object
      properties:
        synced_at:
          type: string
          format: date-time
          nullable: true
        count:
          type: integer
        totals:
          $ref: '#/components/schemas/ShipmentProductsTotals'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentProductRow'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/SalesChannel'
      required:
      - channels
      - count
      - results
      - synced_at
      - totals
    ShipmentProductsTotals:
      type: object
      properties:
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        free_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        revenue_kopecks:
          type: integer
        documents_count:
          type: integer
        products_count:
          type: integer
      required:
      - documents_count
      - free_quantity
      - products_count
      - quantity
      - revenue_kopecks
    SyncRun:
      type: object
      properties:
        status:
          type: string
        status_label:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: number
          format: double
          nullable: true
        request_count:
          type: integer
        error:
          type: string
      required:
      - duration_seconds
      - error
      - finished_at
      - request_count
      - started_at
      - status
      - status_label
    SyncStatus:
      type: object
      properties:
        running:
          type: boolean
        started_at:
          type: string
          format: date-time
          nullable: true
      required:
      - running
      - started_at
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
