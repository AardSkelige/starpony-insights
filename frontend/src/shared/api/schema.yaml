    SupplyMaterials:
      type: object
      properties:
        synced_at:
          type: string
          format: date-time
          nullable: true
        count:
          type: integer
        totals:
          $ref: '#/components/schemas/SupplyMaterialsTotals'
        coverage:
          $ref: '#/components/schemas/SupplyMaterialsCoverage'
        results:
          type: array
          items:
            $ref: '#/components/schemas/SupplyMaterialRow'
        suppliers:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
      required:
      - count
      - coverage
      - results
      - suppliers
      - synced_at
      - totals
    SupplyMaterialsCoverage:
      type: object
      description: |-
        Насколько полное число видит человек — про выборку приёмок целиком.

        Поиск сюда не входит намеренно: он сужает список материалов, а не то,
        что закупили.
      properties:
        materials_count:
          type: integer
        amount_kopecks:
          type: integer
        documents_count:
          type: integer
        suppliers_count:
          type: integer
        positions_count:
          type: integer
        free_positions_count:
          type: integer
        priced_count:
          type: integer
        unpriced_count:
          type: integer
        with_history_count:
          type: integer
        multi_supplier_count:
          type: integer
      required:
      - amount_kopecks
      - documents_count
      - free_positions_count
      - materials_count
      - multi_supplier_count
      - positions_count
      - priced_count
      - suppliers_count
      - unpriced_count
      - with_history_count
    SupplyMaterialsTotals:
      type: object
      description: |-
        Итог под таблицей — про то, что в ней видно, с учётом поиска.

        Обязан сходиться со сложением колонки: файл и экран открывают затем,
        чтобы складывать, и расхождение заметят раньше нас.
      properties:
        materials_count:
          type: integer
        amount_kopecks:
          type: integer
        amount_share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
        priced_count:
          type: integer
        unpriced_count:
          type: integer
        documents_count:
          type: integer
        suppliers_count:
          type: integer
      required:
      - amount_kopecks
      - amount_share
      - documents_count
      - materials_count
      - priced_count
      - suppliers_count
      - unpriced_count
    SyncRun:
      type: object
      properties:
        status:
          type: string
        status_label:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: number
          format: double
          nullable: true
        request_count:
          type: integer
        error:
          type: string
      required:
      - duration_seconds
      - error
      - finished_at
      - request_count
      - started_at
      - status
      - status_label
    SyncStatus:
      type: object
      properties:
        running:
          type: boolean
        started_at:
          type: string
          format: date-time
          nullable: true
      required:
      - running
      - started_at
    WithoutPlanRow:
      type: object
      description: |-
        Проданное, чего техкарта не описывает: услуги и покупные товары.

        Отдельным списком, а не строкой в таблице: доставка не сырьё, и в сумму
        материалов она не входит. Спрятать её тоже нельзя — тогда «сырья на
        399 686 ₽» читалось бы как расход по всей выручке.
      properties:
        product_id:
          type: integer
        name:
          type: string
        article:
          type: string
        code:
          type: string
        uom:
          type: string
        is_service:
          type: boolean
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        revenue_kopecks:
          type: integer
      required:
      - article
      - code
      - is_service
      - name
      - product_id
      - quantity
      - revenue_kopecks
      - uom
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
