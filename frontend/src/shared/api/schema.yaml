    Stock:
      type: object
      description: |-
        Что лежит на складе сейчас — одинаково для товара и для материала.

        Один сериализатор, а не два одинаковых: из схемы генерируются типы
        фронтенда, и два близнеца дают два типа, под которые пишутся два
        компонента. Так и вышло — блок «Склад» разошёлся между страницами
        и на одной из них перестал отличать сбой связи от «остатка нет».
      properties:
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        reserved:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        available:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        stock_days:
          type: integer
          nullable: true
      required:
      - available
      - quantity
      - reserved
      - stock_days
    SupplierPrice:
      type: object
      description: |-
        Что и почём брали у одного поставщика — строка сравнения.

        `above_best` считается от самой низкой **последней** цены среди
        поставщиков. Не от крайних цен вообще: у «Крышки флип-топ» разброс между
        первой и последней ценой одного «Лемуна» — 73%, и назвать это разницей
        между поставщиками значило бы предложить уйти от него к нему же.
      properties:
        supplier_id:
          type: integer
        name:
          type: string
        supplies_count:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        amount_kopecks:
