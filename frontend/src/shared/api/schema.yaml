components:
  schemas:
    ChannelShare:
      type: object
      description: Доля канала в продажах товара. Основа полос в раскрытии строки.
      properties:
        id:
          type: integer
          nullable: true
        name:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        revenue_kopecks:
          type: integer
      required:
      - id
      - name
      - quantity
      - revenue_kopecks
    Csrf:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    FilterOption:
      type: object
      description: |-
        Значение справочника в выпадающем списке фильтров.

        Один тип на канал продаж и на поставщика: в списке они устроены
        одинаково — идентификатор и подпись, — а два одинаковых типа в схеме
        дали бы фронтенду два компонента вместо одного поля фильтра.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - password
      - username
    MaterialCoverage:
      type: object
      description: |-
        На сколько хватит остатка при нынешнем расходе.

        Первая половина порога закупки (`PRD.md` §5.9): `minimumBalance` пуст
        у всех 314 позиций, а расход за период против свободного остатка
        берётся из фактов учёта.

        **Это не прогноз**, и подсказка на экране обязана это сказать: средний
        расход выбранного периода, а не тренд. Меняешь период — меняется число.
      properties:
        per_day:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        days_of_period:
          type: integer
        days_left:
          type: integer
          nullable: true
        level:
          type: string
      required:
      - days_left
      - days_of_period
      - level
      - per_day
    MaterialDistribution:
      type: object
      properties:
        top:
          type: array
          items:
            $ref: '#/components/schemas/MaterialShare'
        rest:
          allOf:
          - $ref: '#/components/schemas/MaterialShareRest'
          nullable: true
      required:
      - rest
      - top
    MaterialHead:
      type: object
      description: |-
        Шапка разбора строки: чем именно является материал.

        Один сериализатор на оба раздела. Поля у них совпадали до буквы, и схема
        из-за двойника выдавала предупреждение «два компонента с одним именем
        и разными телами» — то есть фронтенд получил бы неверные типы, ничего
        об этом не узнав.
      properties:
        id:
          type: integer
        name:
          type: string
        article:
          type: string
        code:
          type: string
        uom:
          type: string
      required:
      - article
      - code
      - id
      - name
      - uom
    MaterialPath:
      type: object
      description: |-
        Один путь по техкартам и то, сколько материала пришло именно им.

        Количество обязательно: без него путь говорит «через замес и через
        розлив», но не отвечает, чего сколько, — а объяснение, которое не
        складывается обратно в объясняемое число, объяснением не является.
      properties:
        chain:
          type: array
          items:
            type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
      required:
      - chain
      - quantity
    MaterialPrice:
      type: object
      description: |-
        Откуда взялась цена: документ, дата, поставщик.

        Число, посчитанное по цене, обязано назвать её источник. Иначе колонка
        «Стоимость» остаётся суммой, за которую никто не отвечает.
      properties:
        price_kopecks:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        moment:
          type: string
          format: date-time
        document_number:
          type: string
        supplier:
          type: string
      required:
      - document_number
      - moment
      - price_kopecks
      - supplier
    MaterialRate:
      type: object
      description: |-
        Норма расхода: сколько материала уходит на одно изделие.

        Группой, а не по изделию: у 121 материала из 161 норма одна на все,
        и шестнадцать одинаковых строк не сообщают ничего сверх одной. У 40
        норма различается — у диметикона 200 г против 20 г, разница в десять
        раз, и увидеть её больше негде.
      properties:
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        products_count:
          type: integer
        examples:
          type: array
          items:
            type: string
      required:
      - examples
      - products_count
      - rate
    MaterialRest:
      type: object
      description: |-
        Свёрнутый хвост списка источников.

        Без него показанные слагаемые не складывались бы в число, которое панель
        объясняет: у воды пятьдесят девять изделий-источников, а видно двадцать.
      properties:
        products_count:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
      required:
      - products_count
      - quantity
    MaterialShare:
      type: object
      description: Изделие и его доля в расходе материала.
      properties:
        product_id:
          type: integer
        name:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
      required:
      - name
      - product_id
      - quantity
      - share
    MaterialShareRest:
      type: object
      description: |-
        Свёрнутый хвост распределения.

        Без него показанные доли не складываются в сто процентов, а количества —
        в объясняемое число, и расхождение спишут на расчёт.
      properties:
        products_count:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
      required:
      - products_count
      - quantity
      - share
    MaterialSource:
      type: object
      description: Изделие, из-за продажи которого материал израсходован.
      properties:
        product_id:
          type: integer
        name:
          type: string
        sold_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        sold_uom:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        paths:
          type: array
          items:
            $ref: '#/components/schemas/MaterialPath'
      required:
      - name
      - paths
      - product_id
      - quantity
      - sold_quantity
      - sold_uom
    Page:
      type: object
      description: Страница в меню. Префиксы API наружу не отдаются — это деталь защиты.
      properties:
        key:
          type: string
        label:
          type: string
        group:
          type: string
        route:
          type: string
      required:
      - group
      - key
      - label
      - route
    PricePoint:
      type: object
      description: |-
        Точка ряда цен: когда и почём. Дата обязательна вместе с ценой.

        Линия строится по времени, а не по номеру закупки: между 28.02 и 14.05
        два с половиной месяца, между 01.07 и 30.07 — один, и равные промежутки
        на экране соврали бы о том, как быстро материал дорожает.
      properties:
        moment:
          type: string
          format: date-time
        price_kopecks:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
      required:
      - moment
      - price_kopecks
    ProductDocument:
      type: object
      properties:
        number:
          type: string
        moment:
          type: string
          format: date-time
        agent:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        total_kopecks:
          type: integer
      required:
      - agent
      - moment
      - number
      - quantity
      - total_kopecks
    Profile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        full_name:
          type: string
        is_superuser:
          type: boolean
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Page'
      required:
      - full_name
      - id
      - is_superuser
      - pages
      - username
    Purchase:
      type: object
      description: |-
        Одна закупка: документ целиком, а не строка в нём.

        Цена средневзвешенная, если строк было несколько: диметилфталат пришёл
        одной приёмкой двумя партиями — 2000 г по 40 копеек и 3000 г по 45.
        Показать их двумя закупками значило бы нарисовать скачок цены,
        которого не было.
      properties:
        document_id:
          type: integer
        number:
          type: string
        moment:
          type: string
          format: date-time
        supplier:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        amount_kopecks:
          type: integer
        price_kopecks:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
          nullable: true
        is_free:
          type: boolean
        price_change:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,8})?$
          nullable: true
      required:
      - amount_kopecks
      - document_id
      - is_free
      - moment
      - number
      - price_change
      - price_kopecks
      - quantity
      - supplier
    Refused:
      type: object
      properties:
        detail:
          type: string
        retry_after_seconds:
          type: integer
      required:
      - detail
      - retry_after_seconds
    ShipmentMaterialDetail:
