      - suppliers_count
      - unpriced_count
      - with_history_count
    SupplyMaterialsTotals:
      type: object
      description: |-
        Итог под таблицей — про то, что в ней видно, с учётом поиска.

        Обязан сходиться со сложением колонки: файл и экран открывают затем,
        чтобы складывать, и расхождение заметят раньше нас.
      properties:
        materials_count:
          type: integer
        amount_kopecks:
