          type: string
          format: date
          nullable: true
      - in: query
        name: date_to
        schema:
          type: string
          format: date
          nullable: true
      - in: path
        name: material_id
        schema:
          type: integer
        required: true
      - in: query
        name: ordering
        schema:
          enum:
          - -cost
          - -name
          - -products
          - -quantity
          - -share
          - cost
          - name
          - products
          - quantity
          - share
          type: string
          default: -cost
          minLength: 1
        description: |-
          * `-cost` - -cost
          * `-name` - -name
          * `-products` - -products
          * `-quantity` - -quantity
          * `-share` - -share
          * `cost` - cost
          * `name` - name
          * `products` - products
          * `quantity` - quantity
          * `share` - share
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 10
      - in: query
        name: search
        schema:
          type: string
          default: ''
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentMaterialDetail'
          description: ''
        '404':
          description: No response body
  /api/shipments/materials/xlsx/:
