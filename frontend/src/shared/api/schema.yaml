openapi: 3.0.3
info:
  title: StarPony Insights API
  version: 1.0.0
paths:
  /api/auth/csrf/:
    get:
      operationId: api_auth_csrf_retrieve
      description: |-
        Выдать CSRF-куку перед формой входа.

        Фронтенд — статика, отданная прокси, шаблонов Django он не рендерит,
        поэтому получить токен из скрытого поля формы неоткуда.
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/channels/:
    get:
      operationId: channels_list
      description: 'Где продаём и сколько это приносит: выручка и её доля, число отгрузок,
        средний чек с разбросом, покупатели и ассортимент канала, а также выручка
        по каналам во времени.'
      summary: Каналы продаж
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: date_to
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: ordering
        schema:
          enum:
          - -buyers
          - -last
          - -name
          - -products
          - -receipt
          - -revenue
          - -shipments
          - buyers
          - last
          - name
          - products
          - receipt
          - revenue
          - shipments
          type: string
          default: -revenue
          minLength: 1
        description: |-
          * `-buyers` - -buyers
          * `-last` - -last
          * `-name` - -name
          * `-products` - -products
          * `-receipt` - -receipt
          * `-revenue` - -revenue
          * `-shipments` - -shipments
          * `buyers` - buyers
          * `last` - last
          * `name` - name
          * `products` - products
          * `receipt` - receipt
          * `revenue` - revenue
          * `shipments` - shipments
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 10
      - in: query
        name: search
        schema:
          type: string
          default: ''
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channels'
          description: ''
  /api/channels/xlsx/:
    get:
      operationId: channels_xlsx
      description: Та же выборка, что на экране, целиком. Вторым листом — каждая отгрузка
        отдельной строкой.
      summary: Каналы продаж — выгрузка в Excel
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: date_to
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: ordering
        schema:
          enum:
          - -buyers
          - -last
          - -name
          - -products
          - -receipt
          - -revenue
          - -shipments
          - buyers
          - last
          - name
          - products
          - receipt
          - revenue
          - shipments
          type: string
          default: -revenue
          minLength: 1
        description: |-
          * `-buyers` - -buyers
          * `-last` - -last
          * `-name` - -name
          * `-products` - -products
          * `-receipt` - -receipt
          * `-revenue` - -revenue
          * `-shipments` - -shipments
          * `buyers` - buyers
          * `last` - last
          * `name` - name
          * `products` - products
          * `receipt` - receipt
          * `revenue` - revenue
          * `shipments` - shipments
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 10
      - in: query
        name: search
        schema:
          type: string
          default: ''
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          description: ''
  /api/deadlines/:
    get:
      operationId: deadlines_list
      description: 'Кто должен, сколько и как давно. Три суммы отдельно: дебиторка,
        расчёты через площадку и товар, отгруженный по договору комиссии — складывать
        их нельзя, «нам должны» означает только первую.'
      summary: Сроки оплаты
      parameters:
      - in: query
        name: ordering
        schema:
          enum:
          - -debt
          - -documents
          - -name
          - -oldest
          - debt
          - documents
          - name
          - oldest
          type: string
          default: -debt
          minLength: 1
        description: |-
          * `-debt` - -debt
          * `-documents` - -documents
          * `-name` - -name
          * `-oldest` - -oldest
          * `debt` - debt
          * `documents` - documents
          * `name` - name
          * `oldest` - oldest
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 10
      - in: query
        name: search
        schema:
          type: string
          default: ''
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deadlines'
          description: ''
  /api/deadlines/{agent_id}/:
    get:
      operationId: deadlines_detail
      description: Неоплаченные документы контрагента с возрастом и сроком оплаты,
        плюс товар, отгруженный ему по договору комиссии.
      summary: Долг контрагента — из чего сложился
      parameters:
      - in: path
        name: agent_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadlineDetail'
          description: ''
        '404':
          description: No response body
  /api/deadlines/xlsx/:
    get:
      operationId: deadlines_xlsx
      description: Та же выборка, что на экране, целиком. Вторым листом — каждый неоплаченный
        документ отдельной строкой.
      summary: Сроки оплаты — выгрузка в Excel
      parameters:
      - in: query
        name: ordering
        schema:
          enum:
          - -debt
          - -documents
          - -name
          - -oldest
          - debt
          - documents
          - name
          - oldest
          type: string
          default: -debt
          minLength: 1
        description: |-
          * `-debt` - -debt
          * `-documents` - -documents
          * `-name` - -name
          * `-oldest` - -oldest
          * `debt` - debt
          * `documents` - documents
          * `name` - name
          * `oldest` - oldest
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 10
      - in: query
        name: search
        schema:
          type: string
          default: ''
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          description: ''
  /api/profitability/:
    get:
      operationId: profitability_list
      description: 'На чём зарабатываем и на чём теряем: выручка, себестоимость на
        момент продажи, прибыль и маржа по каждому товару. Отдельно — маржа через
        площадки, у которой не вычтена их комиссия, товар на реализации и то, что
        отдано даром.'
      summary: Прибыльность
      parameters:
      - in: query
        name: basis
        schema:
          enum:
          - sold
          - shipped
          type: string
          default: sold
          minLength: 1
        description: |-
          sold — деньги за товар: товар по договору комиссии становится проданным с приходом отчёта комиссионера. shipped — всё, что уехало со склада.

          * `sold` - sold
          * `shipped` - shipped
      - in: query
        name: date_from
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: date_to
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: ordering
        schema:
          enum:
          - -cost
          - -margin
          - -name
          - -profit
          - -quantity
          - -revenue
          - cost
          - margin
          - name
          - profit
          - quantity
          - revenue
          type: string
          default: -profit
          minLength: 1
        description: |-
          * `-cost` - -cost
          * `-margin` - -margin
          * `-name` - -name
          * `-profit` - -profit
          * `-quantity` - -quantity
          * `-revenue` - -revenue
          * `cost` - cost
          * `margin` - margin
          * `name` - name
          * `profit` - profit
          * `quantity` - quantity
          * `revenue` - revenue
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 10
      - in: query
        name: search
        schema:
          type: string
          default: ''
      - in: query
        name: with_free
        schema:
          type: boolean
          default: false
        description: 'Считать ли товар, отданный даром. По умолчанию нет: у него есть
          себестоимость и нет выручки, и он тянет маржу вниз у каждого четвёртого
          товара.'
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profitability'
          description: ''
  /api/profitability/xlsx/:
    get:
      operationId: profitability_xlsx
      description: 'Та же выборка, что на экране, целиком. Вторым листом — линейки
        продукции: вопрос «на какой линейке зарабатываем» решается по группам, а не
        по товарам.'
      summary: Прибыльность — выгрузка в Excel
      parameters:
