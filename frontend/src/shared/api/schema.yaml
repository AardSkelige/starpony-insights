          type: integer
          nullable: true
      - in: query
        name: date_from
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: date_to
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: ordering
        schema:
          enum:
          - -cost
          - -name
          - -products
          - -quantity
          - -share
          - cost
          - name
          - products
          - quantity
          - share
          type: string
          default: -cost
          minLength: 1
        description: |-
          * `-cost` - -cost
          * `-name` - -name
          * `-products` - -products
          * `-quantity` - -quantity
          * `-share` - -share
          * `cost` - cost
          * `name` - name
          * `products` - products
          * `quantity` - quantity
          * `share` - share
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
