          type: string
          format: date
          nullable: true
      - in: query
        name: date_to
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: ordering
        schema:
          enum:
          - -cost
          - -margin
          - -name
          - -profit
          - -quantity
          - -revenue
          - cost
          - margin
          - name
          - profit
          - quantity
          - revenue
          type: string
          default: -profit
          minLength: 1
        description: |-
          * `-cost` - -cost
          * `-margin` - -margin
          * `-name` - -name
          * `-profit` - -profit
          * `-quantity` - -quantity
          * `-revenue` - -revenue
          * `cost` - cost
          * `margin` - margin
          * `name` - name
          * `profit` - profit
          * `quantity` - quantity
          * `revenue` - revenue
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 10
      - in: query
        name: search
        schema:
          type: string
          default: ''
      - in: query
        name: with_free
        schema:
          type: boolean
          default: false
        description: 'Считать ли товар, отданный даром. По умолчанию нет: у него есть
          себестоимость и нет выручки, и он тянет маржу вниз у каждого четвёртого
          товара.'
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          description: ''
  /api/shipments/materials/:
    get:
      operationId: shipment_materials_list
      description: Сколько сырья ушло вместе с проданной продукцией. Проданное разворачивается
        по техкартам до того, что закупают.
