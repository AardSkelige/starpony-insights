openapi: 3.0.3
info:
  title: StarPony Insights API
  version: 1.0.0
paths:
  /api/auth/csrf/:
    get:
      operationId: api_auth_csrf_retrieve
      description: |-
        Выдать CSRF-куку перед формой входа.

        Фронтенд — статика, отданная прокси, шаблонов Django он не рендерит,
        поэтому получить токен из скрытого поля формы неоткуда.
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/shipments/materials/:
    get:
      operationId: shipment_materials_list
      description: Сколько сырья ушло вместе с проданной продукцией. Проданное разворачивается
        по техкартам до того, что закупают.
      summary: Материалы в отгрузках
      parameters:
      - in: query
        name: channel_id
        schema:
          type: integer
          nullable: true
      - in: query
        name: date_from
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: date_to
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: ordering
        schema:
          enum:
          - -cost
          - -name
          - -products
          - -quantity
          - -share
          - cost
          - name
          - products
          - quantity
          - share
          type: string
          default: -cost
          minLength: 1
        description: |-
          * `-cost` - -cost
          * `-name` - -name
          * `-products` - -products
          * `-quantity` - -quantity
          * `-share` - -share
          * `cost` - cost
          * `name` - name
          * `products` - products
          * `quantity` - quantity
          * `share` - share
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 10
      - in: query
        name: search
        schema:
          type: string
          default: ''
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentMaterials'
          description: ''
