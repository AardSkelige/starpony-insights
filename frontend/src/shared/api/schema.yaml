openapi: 3.0.3
info:
  title: StarPony Insights API
  version: 1.0.0
paths:
  /api/auth/csrf/:
    get:
      operationId: api_auth_csrf_retrieve
      description: |-
        Выдать CSRF-куку перед формой входа.

        Фронтенд — статика, отданная прокси, шаблонов Django он не рендерит,
        поэтому получить токен из скрытого поля формы неоткуда.
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /healthz:
    get:
      operationId: healthz_retrieve
      tags:
      - healthz
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
components:
  schemas:
    Csrf:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - password
      - username
    Page:
      type: object
      description: Страница в меню. Префиксы API наружу не отдаются — это деталь защиты.
      properties:
        key:
          type: string
        label:
          type: string
        group:
          type: string
        route:
          type: string
      required:
      - group
      - key
      - label
      - route
    Profile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        full_name:
          type: string
        is_superuser:
          type: boolean
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Page'
      required:
      - full_name
      - id
      - is_superuser
      - pages
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
