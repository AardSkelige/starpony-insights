      type: object
      properties:
        status:
          type: string
        status_label:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: number
          format: double
          nullable: true
        request_count:
          type: integer
