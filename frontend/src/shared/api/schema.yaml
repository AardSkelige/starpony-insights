components:
  schemas:
    AgeShelf:
      type: object
      description: |-
        Полка возраста: сколько денег лежит без движения столько-то дней.

        Полки упорядочены и приходят всегда все четыре, включая пустые:
        пропущенная корзина превращает шкалу в произвольный набор столбиков,
        а «между 15 и 60 днями ничего нет» — это ответ, и он должен быть виден.
      properties:
        key:
          type: string
        label:
          type: string
        up_to_days:
          type: integer
          nullable: true
        fresh:
          type: boolean
        count:
          type: integer
        debt_kopecks:
          type: integer
        share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
      required:
      - count
      - debt_kopecks
      - fresh
      - key
      - label
      - share
      - up_to_days
    AgentShare:
      type: object
      description: |-
        Контрагент с количеством: и покупатель, и получатель бесплатного.

        Один тип на оба блока — поля совпадают до буквы, а два близнеца в схеме
        дали бы фронтенду два типа, под которые пишутся два компонента.
      properties:
        agent_id:
          type: integer
        name:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        revenue_kopecks:
          type: integer
        documents_count:
          type: integer
        notes:
          type: array
          items:
            type: string
      required:
      - agent_id
      - documents_count
      - name
      - quantity
      - revenue_kopecks
    ChannelRow:
      type: object
      properties:
        channel_id:
          type: integer
        name:
          type: string
        slot:
          type: integer
          nullable: true
        shipments_count:
          type: integer
        revenue_kopecks:
          type: integer
        revenue_share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
        first_moment:
          type: string
          format: date-time
        last_moment:
          type: string
          format: date-time
        receipt:
          $ref: '#/components/schemas/Receipt'
        buyers_count:
          type: integer
        products_count:
          type: integer
        buyers:
          $ref: '#/components/schemas/ChannelTop'
        products:
          $ref: '#/components/schemas/ChannelTop'
        dynamics:
          type: array
          items:
            type: integer
      required:
      - buyers
      - buyers_count
      - channel_id
      - dynamics
      - first_moment
      - last_moment
      - name
      - products
      - products_count
      - receipt
      - revenue_kopecks
      - revenue_share
      - shipments_count
      - slot
    ChannelShare:
      type: object
      description: Доля канала в продажах товара. Основа полос в раскрытии строки.
      properties:
        id:
          type: integer
          nullable: true
        name:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        revenue_kopecks:
          type: integer
      required:
      - id
      - name
      - quantity
      - revenue_kopecks
    ChannelStanding:
      type: object
      description: |-
        Канал в полосах над таблицей: две доли одного канала рядом.

        Отдельный тип, а не строка таблицы: полосам не нужны ни списки
        покупателей, ни ряд по времени, а строк тут всегда все — поиск и страница
        их не сужают.
      properties:
        channel_id:
          type: integer
        name:
          type: string
        slot:
          type: integer
          nullable: true
        revenue_kopecks:
          type: integer
        revenue_share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
        shipments_count:
          type: integer
        shipments_share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
      required:
      - channel_id
      - name
      - revenue_kopecks
      - revenue_share
      - shipments_count
      - shipments_share
      - slot
    ChannelTop:
      type: object
      description: 'Крупнейшие плюс свёрнутый хвост: слагаемые обязаны складываться.'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChannelTopItem'
        rest_count:
          type: integer
        rest_revenue_kopecks:
          type: integer
      required:
      - items
      - rest_count
      - rest_revenue_kopecks
    ChannelTopItem:
      type: object
      description: |-
        Строка списка «кто покупает» и «что покупают».

        Один тип на оба списка: поля совпадают до буквы, и два близнеца в схеме
        дали бы фронтенду два типа, под которые пишутся два компонента.
        Так уже расходился блок «Склад».

        Имя не `ChannelShare`: такой компонент в схеме уже есть — доля канала
        в продажах товара на странице отгрузок. Генератор схемы предупреждает
        о столкновении, но собирает её всё равно, и фронтенд получил бы неверные
        типы, ничего об этом не узнав.
      properties:
        name:
          type: string
        revenue_kopecks:
          type: integer
        share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
        note:
          type: string
      required:
      - name
      - note
      - revenue_kopecks
      - share
    Channels:
      type: object
      properties:
        count:
          type: integer
        synced_at:
          type: string
          format: date-time
          nullable: true
        totals:
          $ref: '#/components/schemas/ChannelsTotals'
        coverage:
          $ref: '#/components/schemas/ChannelsCoverage'
        standings:
          type: array
          items:
            $ref: '#/components/schemas/ChannelStanding'
        dynamics:
          $ref: '#/components/schemas/Dynamics'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ChannelRow'
      required:
      - count
      - coverage
      - dynamics
      - results
      - standings
      - synced_at
      - totals
    ChannelsCoverage:
      type: object
      description: Сводка — про выборку отгрузок целиком. Поиск её не трогает.
      properties:
        channels_count:
          type: integer
        shipments_count:
          type: integer
        revenue_kopecks:
          type: integer
        unassigned_shipments_count:
          type: integer
        unassigned_revenue_kopecks:
          type: integer
        free_shipments_count:
          type: integer
        buyers_count:
          type: integer
        products_count:
          type: integer
      required:
      - buyers_count
      - channels_count
      - free_shipments_count
      - products_count
      - revenue_kopecks
      - shipments_count
      - unassigned_revenue_kopecks
      - unassigned_shipments_count
    ChannelsTotals:
      type: object
      description: Итог под таблицей — про то, что в ней видно, с учётом поиска.
      properties:
        channels_count:
          type: integer
        shipments_count:
          type: integer
        revenue_kopecks:
          type: integer
        revenue_share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
        buyers_count:
          type: integer
        products_count:
          type: integer
      required:
      - buyers_count
      - channels_count
      - products_count
      - revenue_kopecks
      - revenue_share
      - shipments_count
    Consignment:
      type: object
      description: |-
        Товар, отгруженный по договору комиссии. Долгом не считается.

        Ноль — обычный случай: договор комиссии есть у двоих из 107
        контрагентов. Показывается ради одного вопроса — «почему долг такой
        маленький при таких отгрузках».
      properties:
        count:
          type: integer
        kopecks:
          type: integer
        contracts:
          type: array
          items:
            type: string
        first_moment:
          type: string
          format: date
          nullable: true
      required:
      - contracts
      - count
      - first_moment
      - kopecks
    Csrf:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    DeadlineDetail:
      type: object
      properties:
        agent_id:
          type: integer
        name:
          type: string
        is_marketplace:
          type: boolean
        deferral_days:
          type: integer
          nullable: true
        debt_kopecks:
          type: integer
        documents_count:
          type: integer
        oldest_age_days:
          type: integer
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DeadlineDocument'
        rest_count:
          type: integer
        rest_debt_kopecks:
          type: integer
        consignment:
          $ref: '#/components/schemas/Consignment'
      required:
      - agent_id
      - consignment
      - debt_kopecks
      - deferral_days
      - documents
      - documents_count
      - is_marketplace
      - name
      - oldest_age_days
      - rest_count
      - rest_debt_kopecks
    DeadlineDocument:
      type: object
      properties:
        number:
          type: string
        kind:
          type: string
        kind_label:
          type: string
        moment:
          type: string
          format: date-time
        age_days:
          type: integer
        total_kopecks:
          type: integer
        paid_kopecks:
          type: integer
        debt_kopecks:
          type: integer
        due_date:
          type: string
          format: date
          nullable: true
        days_left:
          type: integer
          nullable: true
        group:
          type: string
        explanation:
          type: string
        channel:
          type: string
        description:
          type: string
      required:
      - age_days
      - channel
      - days_left
      - debt_kopecks
      - description
      - due_date
      - explanation
      - group
      - kind
      - kind_label
      - moment
      - number
      - paid_kopecks
      - total_kopecks
    DeadlineRow:
      type: object
      properties:
        agent_id:
          type: integer
        name:
          type: string
        is_marketplace:
          type: boolean
        deferral_days:
          type: integer
          nullable: true
        debt_kopecks:
          type: integer
        debt_share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
        documents_count:
          type: integer
        oldest_age_days:
          type: integer
        newest_age_days:
          type: integer
        aging:
          type: array
          items:
            $ref: '#/components/schemas/AgeShelf'
        kinds:
          type: object
          additionalProperties:
            type: integer
        channels:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            $ref: '#/components/schemas/DebtGroup'
      required:
      - agent_id
      - aging
      - channels
      - debt_kopecks
      - debt_share
      - deferral_days
      - documents_count
      - groups
      - is_marketplace
      - kinds
      - name
      - newest_age_days
      - oldest_age_days
    Deadlines:
      type: object
      properties:
        count:
          type: integer
        synced_at:
          type: string
          format: date-time
          nullable: true
        aging:
          type: array
          items:
            $ref: '#/components/schemas/AgeShelf'
        totals:
          $ref: '#/components/schemas/DeadlinesTotals'
        coverage:
          $ref: '#/components/schemas/DeadlinesCoverage'
        marketplaces:
          type: array
          items:
            $ref: '#/components/schemas/DeadlineRow'
        results:
          type: array
          items:
            $ref: '#/components/schemas/DeadlineRow'
      required:
      - aging
      - count
      - coverage
      - marketplaces
      - results
      - synced_at
      - totals
    DeadlinesCoverage:
      type: object
      description: |-
        Вся картина расчётов. Поиск её не трогает.

        Три суммы рядом отвечают на вопрос, который иначе задают вслух каждый
        раз: почему «не оплачено» в учёте и «нам должны» — разные числа.
      properties:
        counterparties_count:
          type: integer
        documents_count:
          type: integer
        debt_kopecks:
          type: integer
        marketplaces_count:
          type: integer
        marketplace_documents_count:
          type: integer
        marketplace_kopecks:
          type: integer
        consignment_count:
          type: integer
        consignment_kopecks:
          type: integer
        consignment_counterparties_count:
          type: integer
        with_deferral_count:
          type: integer
        counterparties_total:
          type: integer
        overdue_count:
          type: integer
        overdue_kopecks:
          type: integer
        soon_count:
          type: integer
        soon_kopecks:
          type: integer
      required:
      - consignment_count
      - consignment_counterparties_count
      - consignment_kopecks
      - counterparties_count
      - counterparties_total
      - debt_kopecks
      - documents_count
      - marketplace_documents_count
      - marketplace_kopecks
      - marketplaces_count
      - overdue_count
      - overdue_kopecks
      - soon_count
      - soon_kopecks
      - with_deferral_count
    DeadlinesTotals:
      type: object
      description: Итог под таблицей — про то, что в ней видно, с учётом поиска.
      properties:
        counterparties_count:
          type: integer
        documents_count:
          type: integer
        debt_kopecks:
          type: integer
        debt_share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
        oldest_age_days:
          type: integer
          nullable: true
      required:
      - counterparties_count
      - debt_kopecks
      - debt_share
      - documents_count
      - oldest_age_days
    DebtGroup:
      type: object
      description: |-
        Группа срока: просрочено, скоро истекает, в норме, без отсрочки.

        Сегодня всё до последнего документа лежит в «без оформленной отсрочки».
        Группы включатся сами, когда в учёте появятся дни отсрочки, — поэтому
        поле есть в контракте с первого дня, а не добавляется потом.
      properties:
        key:
          type: string
        label:
          type: string
        count:
          type: integer
        debt_kopecks:
          type: integer
      required:
      - count
      - debt_kopecks
      - key
      - label
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Dynamics:
      type: object
      description: Выручка по каналам во времени — стопка столбиков.
      properties:
        step:
          type: string
        step_label:
          type: string
        series:
          type: array
          items:
            $ref: '#/components/schemas/DynamicsSeries'
        points:
          type: array
          items:
            $ref: '#/components/schemas/DynamicsPoint'
      required:
      - points
      - series
      - step
      - step_label
    DynamicsPoint:
      type: object
      description: |-
        Один столбик. Границы обе: одна дата рядом с подписью «по неделям»
        читается как день — так и вышло при первом показе на соседней странице.
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        values:
          type: array
          items:
            type: integer
      required:
      - end
      - start
      - values
    DynamicsSeries:
      type: object
      properties:
        channel_id:
          type: integer
          nullable: true
        name:
          type: string
        slot:
          type: integer
          nullable: true
        revenue_kopecks:
          type: integer
      required:
      - channel_id
      - name
      - revenue_kopecks
      - slot
    FilterOption:
      type: object
      description: |-
        Значение справочника в выпадающем списке фильтров.

        Один тип на канал продаж и на поставщика: в списке они устроены
        одинаково — идентификатор и подпись, — а два одинаковых типа в схеме
        дали бы фронтенду два компонента вместо одного поля фильтра.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    GivenAway:
      type: object
      description: |-
        Товар, изрядная часть которого уходит без оплаты.

        Доля от отгруженного, а не штуки: сто штук Репеллента из четырёхсот
        и семьдесят три Шампуня из ста тридцати девяти — разные истории,
        и вторая заметнее, хотя число меньше.
      properties:
        product_id:
          type: integer
        name:
          type: string
        article:
          type: string
        free_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        shipped_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        free_cost_kopecks:
          type: integer
        share:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,8})?$
      required:
      - article
      - free_cost_kopecks
      - free_quantity
      - name
      - product_id
      - share
      - shipped_quantity
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    LeadTime:
      type: object
      description: |-
        Медиана в днях вместе с тем, из чего она получена.

        Один тип на регулярность и на срок поставки: поля у них совпадают
        до буквы, и два близнеца в схеме дали бы фронтенду два типа, под которые
        пишутся два компонента. Так уже расходился блок «Склад».

        Названия полей нейтральны к смыслу (`days`, а не `interval_days`)
        именно поэтому: подпись даёт колонка, а не контракт.
      properties:
        days:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,1})?$
          nullable: true
        measurements:
          type: integer
        min_days:
          type: integer
          nullable: true
        max_days:
          type: integer
          nullable: true
        average_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,1})?$
          nullable: true
        unlinked:
          type: integer
      required:
      - average_days
      - days
      - max_days
      - measurements
      - min_days
      - unlinked
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - password
      - username
    MaterialCoverage:
      type: object
      description: |-
        На сколько хватит остатка при нынешнем расходе.

        Один тип на два раздела: «Материалы в отгрузках» отвечают им на «надолго
        ли хватит», «Материалы в приёмках» — на «пора ли закупать». Вопрос разный,
        число одно, и разойтись оно не имеет права.

        Первая половина порога закупки (`PRD.md` §5.9): `minimumBalance` пуст
        у всех 314 позиций, а расход за период против свободного остатка
        берётся из фактов учёта.

        **Это не прогноз**, и подсказка на экране обязана это сказать: средний
        расход выбранного периода, а не тренд. Меняешь период — меняется число.
      properties:
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        per_day:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        days_of_period:
          type: integer
        days_left:
          type: integer
          nullable: true
        level:
          type: string
      required:
      - days_left
      - days_of_period
      - level
      - per_day
      - quantity
    MaterialDistribution:
      type: object
      properties:
        top:
          type: array
          items:
            $ref: '#/components/schemas/MaterialShare'
        rest:
          allOf:
          - $ref: '#/components/schemas/MaterialShareRest'
          nullable: true
      required:
      - rest
      - top
    MaterialHead:
      type: object
      description: |-
        Шапка разбора строки: чем именно является материал.

        Один сериализатор на оба раздела. Поля у них совпадали до буквы, и схема
        из-за двойника выдавала предупреждение «два компонента с одним именем
        и разными телами» — то есть фронтенд получил бы неверные типы, ничего
        об этом не узнав.
      properties:
        id:
          type: integer
        name:
          type: string
        article:
          type: string
        code:
          type: string
        uom:
          type: string
      required:
      - article
      - code
      - id
      - name
      - uom
    MaterialPath:
      type: object
      description: |-
        Один путь по техкартам и то, сколько материала пришло именно им.

        Количество обязательно: без него путь говорит «через замес и через
        розлив», но не отвечает, чего сколько, — а объяснение, которое не
        складывается обратно в объясняемое число, объяснением не является.
      properties:
        chain:
          type: array
          items:
            type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
      required:
      - chain
      - quantity
    MaterialPrice:
      type: object
      description: |-
        Откуда взялась цена: документ, дата, поставщик.

        Число, посчитанное по цене, обязано назвать её источник. Иначе колонка
        «Стоимость» остаётся суммой, за которую никто не отвечает.
      properties:
        price_kopecks:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        moment:
          type: string
          format: date-time
        document_number:
          type: string
        supplier:
          type: string
      required:
      - document_number
      - moment
      - price_kopecks
      - supplier
    MaterialRate:
      type: object
      description: |-
        Норма расхода: сколько материала уходит на одно изделие.

        Группой, а не по изделию: у 121 материала из 161 норма одна на все,
        и шестнадцать одинаковых строк не сообщают ничего сверх одной. У 40
        норма различается — у диметикона 200 г против 20 г, разница в десять
        раз, и увидеть её больше негде.
      properties:
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        products_count:
          type: integer
        examples:
          type: array
          items:
            type: string
      required:
      - examples
      - products_count
      - rate
    MaterialRest:
      type: object
      description: |-
        Свёрнутый хвост списка источников.

        Без него показанные слагаемые не складывались бы в число, которое панель
        объясняет: у воды пятьдесят девять изделий-источников, а видно двадцать.
      properties:
        products_count:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
      required:
      - products_count
      - quantity
    MaterialShare:
      type: object
      description: Изделие и его доля в расходе материала.
      properties:
        product_id:
          type: integer
        name:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
      required:
      - name
      - product_id
      - quantity
      - share
    MaterialShareRest:
      type: object
      description: |-
        Свёрнутый хвост распределения.

        Без него показанные доли не складываются в сто процентов, а количества —
        в объясняемое число, и расхождение спишут на расчёт.
      properties:
        products_count:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        share:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          nullable: true
      required:
      - products_count
      - quantity
      - share
    MaterialSource:
      type: object
      description: Изделие, из-за продажи которого материал израсходован.
      properties:
        product_id:
          type: integer
        name:
          type: string
        sold_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        sold_uom:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        paths:
          type: array
          items:
            $ref: '#/components/schemas/MaterialPath'
      required:
      - name
      - paths
      - product_id
      - quantity
      - sold_quantity
      - sold_uom
    Page:
      type: object
      description: Страница в меню. Префиксы API наружу не отдаются — это деталь защиты.
      properties:
        key:
          type: string
        label:
          type: string
        group:
          type: string
        route:
          type: string
      required:
      - group
      - key
      - label
      - route
    PricePoint:
      type: object
      description: |-
        Точка ряда цен: когда и почём. Дата обязательна вместе с ценой.

        Линия строится по времени, а не по номеру закупки: между 28.02 и 14.05
        два с половиной месяца, между 01.07 и 30.07 — один, и равные промежутки
        на экране соврали бы о том, как быстро материал дорожает.
      properties:
        moment:
          type: string
          format: date-time
        price_kopecks:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
      required:
      - moment
      - price_kopecks
    Profile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        full_name:
          type: string
        is_superuser:
          type: boolean
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Page'
      required:
      - full_name
      - id
      - is_superuser
      - pages
      - username
    Profitability:
      type: object
      properties:
        count:
          type: integer
        synced_at:
          type: string
          format: date-time
          nullable: true
        totals:
          $ref: '#/components/schemas/ProfitabilityTotals'
        coverage:
          $ref: '#/components/schemas/ProfitabilityCoverage'
        marketplaces:
          $ref: '#/components/schemas/ProfitabilityMarketplaces'
        families:
          type: array
          items:
            $ref: '#/components/schemas/ProfitabilityFamily'
        losses:
          type: array
          items:
            $ref: '#/components/schemas/ProfitabilityRow'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProfitabilityRow'
      required:
      - count
      - coverage
      - families
      - losses
      - marketplaces
      - results
      - synced_at
      - totals
    ProfitabilityCoverage:
      type: object
      description: |-
        Полнота расчёта: что осталось за пределами маржи и почему.

        Поиск её не сужает: это ответ на «полное ли то, что показано».
      properties:
        basis:
          type: string
        with_free:
          type: boolean
        free_products_count:
          type: integer
        free_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        free_cost_kopecks:
          type: integer
        unsold_products_count:
          type: integer
        unsold_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        unsold_kopecks:
          type: integer
        hidden_products_count:
          type: integer
        sold_revenue_kopecks:
          type: integer
        shipped_revenue_kopecks:
          type: integer
        most_given_away:
          type: array
          items:
            $ref: '#/components/schemas/GivenAway'
      required:
      - basis
      - free_cost_kopecks
      - free_products_count
      - free_quantity
      - hidden_products_count
      - most_given_away
      - shipped_revenue_kopecks
      - sold_revenue_kopecks
      - unsold_kopecks
      - unsold_products_count
      - unsold_quantity
      - with_free
    ProfitabilityFamily:
      type: object
      description: Линейка продукции — последнее звено пути группы в номенклатуре.
      properties:
        name:
          type: string
        products_count:
          type: integer
        revenue_kopecks:
          type: integer
        cost_kopecks:
          type: integer
        profit_kopecks:
          type: integer
        margin:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,8})?$
          nullable: true
      required:
      - cost_kopecks
      - margin
      - name
      - products_count
      - profit_kopecks
      - revenue_kopecks
    ProfitabilityMarketplaces:
      type: object
      description: |-
        Две маржи, из которых верна одна.

