  /api/sync/refresh/:
    post:
      operationId: sync_refresh
      description: 'Единственное место, где запрос человека доходит до МойСклада.
        Ограничено паузой между запусками и блокировкой: корзина лимита общая с ботом,
        который проверяет учёт круглосуточно.'
      summary: Обновить данные из МойСклада
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRun'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refused'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refused'
          description: ''
  /api/sync/status/:
