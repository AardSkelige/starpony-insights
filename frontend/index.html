<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StarPony Insights</title>

    <!-- Иконки собраны из одного контура: npm run icons. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Запасной для браузеров, не понимающих SVG в rel="icon". -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <!-- iOS берёт для ярлыка только это имя и только PNG. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="Insights" />

    <!-- Цвет системной строки в ярлыке на телефоне. Без media: тему человек
         может выбрать вручную, вразрез с системной, — значение проставляет
         скрипт ниже и дальше держит ThemeProvider. -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Тема ставится до первой отрисовки, а не в React.
      //
      // Иначе документ успевает показаться без класса — то есть светлым, —
      // и человек с тёмной темой получает белую вспышку на каждой загрузке.
      // Ровно то, что DESIGN.md §3 обещает не допускать на экране входа.
      //
      // Скрипт синхронный и стоит в <head> намеренно: любая асинхронность
      // здесь возвращает вспышку.
      ;(function () {
        try {
          var stored = localStorage.getItem("theme")
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
          document.documentElement.classList.add(theme)

          // Значения --background обеих тем. Литералами: стили ещё не
          // загружены, прочитать переменную неоткуда.
          document.querySelector('meta[name="theme-color"]').content =
            theme === "dark" ? "#0a0a0a" : "#ffffff"
        } catch (error) {
          // Приватный режим может запрещать localStorage. Тогда просто
          // остаёмся на светлой теме — это лучше, чем пустая страница.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
