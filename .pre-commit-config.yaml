# Один менеджер хуков на репозиторий. Husky здесь не используется намеренно:
# он переключает core.hooksPath на .husky и тем самым отключает .git/hooks,
# где стоит сканер секретов. Два менеджера одного хука — это тихо потерянная
# проверка, а теряется всегда та, которую забыли.
#
# Каждый хук начинается с `source scripts/hook-env.sh`: git из IDE приходит
# с голым PATH, где нет ни node, ни gitleaks. Подробности — в самом скрипте.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (секреты)
        entry: bash -c 'source scripts/hook-env.sh && exec gitleaks git --pre-commit --staged --redact --verbose'
        language: system
        pass_filenames: false

      - id: frontend-lint
        name: eslint (фронтенд)
        # Имена файлов не передаём намеренно: pre-commit отдаёт пути от корня
        # репозитория, а eslint запускается из frontend/ и таких путей не видит —
        # хук молча зеленел бы на любом файле. Проверяем весь фронтенд, это секунды.
        entry: bash -c 'source scripts/hook-env.sh && cd frontend && npm run --silent lint'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-typecheck
        name: tsc (фронтенд)
        entry: bash -c 'source scripts/hook-env.sh && cd frontend && npm run --silent typecheck'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: backend-lint
        # Только ошибки логики, не стиль: настройка и обоснование —
        # в backend/ruff.toml. Заведён после того, как задвоенный ключ
        # словаря пережил и pytest, и обзор глазами.
        #
        # Имена файлов не передаём по той же причине, что у eslint: pre-commit
        # отдаёт пути от корня репозитория, а ruff запускается из backend/
        # и таких путей не видит. Весь бэкенд проверяется за доли секунды.
        name: ruff (бэкенд)
        entry: bash -c 'source scripts/hook-env.sh && cd backend && ../.venv/bin/ruff check .'
        language: system
        # Не только `.py`: правка самого `ruff.toml` меняет набор правил,
        # а `requirements.txt` — версию линтера. С шаблоном по одним лишь
        # исходникам такой коммит проходил мимо проверки
        # («no files to check» → Skipped), и ослабленное правило въезжало
        # в репозиторий незамеченным.
        files: ^backend/(.*\.py|ruff\.toml|requirements\.txt)$
        pass_filenames: false

      - id: backend-tests
        name: pytest (бэкенд)
        entry: bash -c 'source scripts/hook-env.sh && cd backend && ../.venv/bin/python -m pytest -q'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
