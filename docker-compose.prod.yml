# Боевая сборка StarPony Insights.
#
# Наружу не смотрит ни один порт: снаружи виден только общий Caddy, который
# живёт отдельно и обслуживает оба проекта на сервере. Он же отдаёт статику
# фронтенда из тома starpony_static и проксирует /api на gunicorn.

name: starpony

services:
  db:
    container_name: starpony-db
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starpony}
      POSTGRES_USER: ${POSTGRES_USER:-starpony}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
    volumes:
      # Без /data на конце: с 18-й версии образ сам кладёт кластер
      # в подкаталог ради pg_upgrade --link.
      - pgdata:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starpony} -d ${POSTGRES_DB:-starpony}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Без лимита OOM-killer выбирает процесс с наибольшим потреблением — то есть
    # Postgres, возможно чужого проекта. На сервере живут две системы, и одна
    # не должна ронять другую.
    mem_limit: 256m
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    container_name: starpony-backend
    image: ghcr.io/aardskelige/starpony-backend:latest
    restart: unless-stopped
    env_file:
      # format: raw отключает подстановку переменных внутри файла. Без него
      # compose видит в значении $ и подставляет «переменную», которой нет:
      # SECRET_KEY молча обрезается с 50 символов до 23, а токен МойСклада
      # приедет покалеченным. Проверено на первом же деплое.
      - path: backend/.env.prod
        format: raw
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Пароль берётся из того же .env, что и у базы. Держать его ещё и внутри
      # .env.prod — значит завести два источника одного значения; разойдутся
      # они молча, а проявится это отказом подключения после деплоя.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:-starpony}
      POSTGRES_USER: ${POSTGRES_USER:-starpony}
    # Параметры проверены на практике в других проектах:
    #   preload        — код читается один раз до форка, экономит память;
    #   max-requests   — воркер перезапускается, чтобы утечки не копились;
    #   worker-tmp-dir — heartbeat в память, а не на диск: на дисковой ФС он
    #                    иногда блокирует воркеры, и сервис «зависает на ровном
    #                    месте» без единой ошибки в логах;
    #   timeout        — больше минуты: кнопка «Обновить» гоняет полный проход
    #                    синхронизации прямо в запросе, и убитый по таймауту
    #                    воркер оставил бы запись журнала навсегда «идущей».
    #
    # Комментариев ВНУТРИ блока быть не может: в блочном скаляре YAML решётка
    # не начинает комментарий, и строка уезжает в аргументы gunicorn —
    # «unrecognized arguments», контейнер не поднимается вовсе.
    command: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --worker-class gthread
      --threads 4
      --timeout 300
      --preload
      --max-requests 1000
      --max-requests-jitter 100
      --worker-tmp-dir /dev/shm
      --access-logfile -
      --error-logfile -
    volumes:
      - static_admin:/app/staticfiles
    networks:
      - internal
      - shared-proxy
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 384m
    logging: *logging

volumes:
  pgdata:
  # Имя задано явно: том монтирует Caddy, живущий в другом compose-файле,
  # и он должен знать имя, а не угадывать префикс проекта.
  static_admin:
    name: starpony_admin_static

# Тома starpony_static здесь нет намеренно. Статику фронтенда выкладывает
# отдельный шаг деплоя (docker run с образом фронтенда), и том создаётся им.
# Описывать здесь сервис, который никто не запускает, — значит держать в файле
# то, что расходится с действительностью.

networks:
  # Django и Postgres. Имя задано явно: без него compose собирает его из имени
  # проекта и получается что-то вроде starpony_internal — читаемо машине,
  # не человеку, который смотрит `docker network ls` в три часа ночи.
  internal:
    name: starpony-internal

  # Общая сеть прокси: через неё Caddy видит приложения обоих проектов.
  # Своя, а не сеть приложения, — намеренно: пока Caddy сидел в сети Horse Bio,
  # `docker compose down` в том проекте пересоздавал её, и прокси разом терял
  # оба сайта.
  shared-proxy:
    external: true
    name: shared-proxy
